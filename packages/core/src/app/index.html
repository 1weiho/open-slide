<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/autono.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autono</title>
    <meta name="description" content="Autono — a slide framework built for agents." />
    <meta property="og:title" content="Autono" />
    <meta property="og:site_name" content="Autono" />
    <meta property="og:description" content="A slide framework built for agents." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./assets/autono-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Autono" />
    <meta name="twitter:description" content="A slide framework built for agents." />
    <meta name="twitter:image" content="./assets/autono-social.png" />
    <style>
      html {
        background-color: oklch(0.99 0 0);
      }
      html.dark {
        background-color: oklch(0.145 0 0);
      }
    </style>
    <script>
      // Apply the stored theme before first paint; next-themes only runs
      // after the bundle loads, which flashes white for dark-mode users.
      let stored = null;
      try {
        stored = localStorage.getItem('theme');
      } catch (_) {}
      const dark =
        stored === 'dark' ||
        (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
